<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Money Grabber</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #6D463C; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; font-family: system-ui, Arial, sans-serif; }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #ping { position: absolute; top: 6px; left: 8px; color: rgba(255,255,255,.85); font-size: 16px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.6); display: none; z-index: 5; }
  #hud { position: absolute; top: 8px; right: 8px; color: rgba(255,255,255,.85); font-size: 13px; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.6); display: none; z-index: 5; }
  #dbg { position: absolute; top: 30px; left: 8px; color: #ffe9c9; background: rgba(0,0,0,.55); font: 11px/1.4 ui-monospace, Consolas, monospace; white-space: pre; padding: 5px 7px; border-radius: 5px; display: none; z-index: 6; pointer-events: none; max-width: 96%; }
  #stage { position: relative; }
  canvas { display: block; touch-action: none; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px; background: rgba(0,0,0,.55); color: #fff; text-align: center; }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0 0 6px; font-size: 38px; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
  .overlay p { margin: 0; font-size: 16px; max-width: 90%; line-height: 1.4; }
  button { font: inherit; font-size: 21px; font-weight: 700; color: #fff; background: #DE8F6E; border: 4px solid #000; border-radius: 14px; padding: 9px 26px; min-width: 232px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.5); }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.5); }
  button.blue { background: #3F7CAC; }
  .red { color: #DE8F6E; } .blu { color: #3F7CAC; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c"></canvas>
  <span id="ping"></span>
  <span id="hud"></span>
  <div id="dbg"></div>
  <div id="menu" class="overlay">
    <h1>MONEY GRABBER</h1>
    <p>Drag the money into your vault: <b class="red">red at the bottom</b>, <b class="blu">blue at the top</b>.<br>
       Coin = 1, banknote = 3. Hooks on the same coin pull it both ways.<br>
       First to 15 wins.</p>
    <button id="b2o" class="blue">2 Players - Online</button>
    <p id="netStatus"></p>
  </div>
  <div id="over" class="overlay hidden">
    <h1 id="overTitle"></h1>
    <button id="again">Play again</button>
    <button id="toMenu" class="blue">Menu</button>
  </div>
</div></div>
<script src="sim.js?v=1"></script>
<script src="lib/snapshot-interpolation.js?v=1"></script>
<script src="game.js?v=1"></script>
</body>
</html>
